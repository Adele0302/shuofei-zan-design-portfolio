name: Verify FDE demo
on:
  push:
    paths:
      - 'projects/enterprise-knowledge-agent-mcp/**'
  pull_request:
    paths:
      - 'projects/enterprise-knowledge-agent-mcp/**'
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11','3.12']
    defaults:
      run:
        working-directory: projects/enterprise-knowledge-agent-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/enterprise-knowledge-agent-mcp/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m app.evaluate
