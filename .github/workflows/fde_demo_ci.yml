name: Verify FDE demo
on:
  push:
    paths:
      - 'projects/enterprise-knowledge-agent-mcp/**'
      - '.github/workflows/fde_demo_ci.yml'
  pull_request:
    paths:
      - 'projects/enterprise-knowledge-agent-mcp/**'
      - '.github/workflows/fde_demo_ci.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
        mcp-sdk: ['v1', 'v2']
    defaults:
      run:
        working-directory: projects/enterprise-knowledge-agent-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: projects/enterprise-knowledge-agent-mcp/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Select official MCP SDK major
        run: |
          if [ "${{ matrix.mcp-sdk }}" = "v1" ]; then
            python -m pip install --upgrade 'mcp>=1.10,<2'
          else
            python -m pip install --upgrade 'mcp>=2,<3'
          fi
      - name: Confirm installed SDK and graph
        run: python -c "import mcp, langgraph; print('mcp and langgraph imported')"
      - name: Unit, API and live stdio integration checks
        run: python -m pytest -q
      - name: Force official SDK + LangGraph integration checks
        run: python -m pytest -q tests/test_advanced.py -k 'explicit_official_sdk_when_available or explicit_langgraph_if_available'
      - name: Synthetic retrieval + safety regression benchmarks
        run: |
          python -m app.evaluate
          python -m app.evaluate_safety
